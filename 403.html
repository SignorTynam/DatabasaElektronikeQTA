<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kjo faqe nuk është për llogarinë tënde · Regjistri QTA</title>
  <link rel="icon" href="/DatabasaElektronike/image/logoPNG2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;600&family=Atkinson+Hyperlegible+Next:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/DatabasaElektronike/app/assets/css/error.css">
  <script src="/DatabasaElektronike/app/assets/js/error-page.js"></script>
</head>
<body>
  <header class="error-shell error-header">
    <a class="error-brand" href="/DatabasaElektronike/"><img src="/DatabasaElektronike/image/logoPNG2.png" alt="QTA"><strong>Regjistri</strong></a>
    <span class="error-context">Qendra e Trajnimeve të Avancuara</span>
  </header>
  <main class="error-shell error-main">
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-code">Gabim 403</p>
      <h1 id="error-title">Kjo faqe nuk është për llogarinë tënde</h1>
      <p>Llogaria jote nuk ka leje për këtë faqe. Nuk ndryshoi asgjë.</p>
      <ul><li>Nëse mendon se duhet ta shohësh, fol me administratorin e QTA-së.</li></ul>
      <div class="error-request" aria-label="Adresa që u kërkua" data-request-path>—</div>
      <div class="error-actions">
        <a class="error-button primary" href="/DatabasaElektronike/">Faqja kryesore</a>
        
        <button class="error-button" type="button" data-back>Kthehu mbrapsht</button>
      </div>
    </section>
  </main>
</body>
</html>
